name: Monitor Meta vehicle feed

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/feed-health.yml"
      - "scripts/check-feed-health.mjs"
      - "public/feed-report.json"
      - "public/rangiora-feed-report.json"
  schedule:
    - cron: "35 */3 * * *"

jobs:
  check-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check feed freshness and match rate
        env:
          MIN_MATCH_RATE: "0.7"
        run: node scripts/check-feed-health.mjs
